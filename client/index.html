<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>AI Wardrobe</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Wardrobe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <style>
      /* Launch screen: the logo on white until the wardrobe has loaded. */
      #splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.36em; transition: opacity 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }
      #splash span { font: 600 22px/1 "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.14em; margin-right: -0.14em; color: #111; }
      #splash.out { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span>AI</span><span>WARDROBE</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
